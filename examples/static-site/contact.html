<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Fieldstone Bakery</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header>
    <a class="name" href="/">Fieldstone Bakery</a>
    <button id="menu-button" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav id="main-nav" aria-label="Main">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </nav>
    <button id="theme-toggle">Switch theme</button>
  </header>
  <main id="main" tabindex="-1">
    <h1>Get in touch</h1>
    <form>
      <label for="name">Name</label>
      <input id="name" autocomplete="name" required>
      <label for="message">Message</label>
      <textarea id="message" rows="4" required></textarea>
      <p><button type="submit">Send</button></p>
    </form>
  </main>
  <footer><p class="muted">Fieldstone Bakery, 12 Mill Lane. Open Tuesday to Sunday.</p></footer>
</body>
</html>
